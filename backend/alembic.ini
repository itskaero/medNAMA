# Alembic configuration for medRAG backend

[alembic]
# path to migration scripts — relative to this file
script_location = alembic

# Use the DATABASE_URL from app.config
# (overridden programmatically in alembic/env.py)
sqlalchemy.url = postgresql://medrag:medrag@localhost:5433/medrag

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
